# Manifiesto educativo de Kubernetes con Pod Security Standards (Restricted) y NetworkPolicy (Cap. 5.4)
apiVersion: v1
kind: Pod
metadata:
  name: api-lab-endurecida
  namespace: laboratorio-seguro
  labels:
    app: api-lab
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: api
      image: python:3.12-slim-bookworm
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: "250m"
          memory: "256Mi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: denegar-trafico-por-defecto
  namespace: laboratorio-seguro
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
